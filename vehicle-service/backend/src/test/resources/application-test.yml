server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:vehicle_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
  main:
    banner-mode: off

services:
  email-service-url: http://localhost:1

management:
  health:
    db:
      enabled: false

logging:
  level:
    org.hibernate.SQL: warn
    com.vms.vehicle: warn